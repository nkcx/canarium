# golangci-lint configuration for Canarium.
#
# The enabled set is deliberately conservative: correctness and resource-leak
# checks that catch the classes of bug this codebase has shipped before
# (ignored errors, leaked contexts, unchecked type assertions), without
# stylistic linters that would generate churn.

run:
  timeout: 5m

linters:
  enable:
    - errcheck      # unchecked error returns
    - govet
    - ineffassign   # assignments never read
    - staticcheck
    - unused        # dead code
    - bodyclose     # unclosed HTTP response bodies
    - contextcheck  # functions that should accept a context
    - errorlint     # incorrect error comparison/wrapping
    - noctx         # HTTP requests built without a context
    - rowserrcheck  # unchecked sql.Rows.Err
    - sqlclosecheck # unclosed sql.Rows / sql.Stmt
    - nilerr        # returning nil after a non-nil error

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

issues:
  exclude-rules:
    # Table-driven tests routinely ignore errors on setup helpers.
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
