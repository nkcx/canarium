canarium:
  # disarmed | dry-run | armed. Start disarmed and watch before you trust it.
  mode: disarmed
  host: 0.0.0.0:8420
  data_dir: /var/lib/canarium

  # How long finished sequences are kept. 0 keeps them forever.
  journal_retain: 30d

  auth:
    # Set this when Canarium is reachable only through a reverse proxy, so
    # session cookies are marked Secure. Leave it off if the daemon can be
    # reached directly: the header is attacker-controlled.
    trust_proxy_headers: false

    # Pin the admin password here instead of the database, for deployments
    # whose data directory is ephemeral. Generate with: canarium hash-password
    # password_hash: "$2a$12$..."

  # Refuse runtime changes to settings this file declares, for GitOps-style
  # deployments where the next deploy would revert them anyway.
  # config_readonly: true

# Defaults for the transports. Individual clients override these in their
# own config: block.
transports:
  ssh:
    user: root
    key_path: /etc/canarium/id_ed25519
    # accept-new learns each host's key on first contact and pins it.
    # strict requires keys to be present in known_hosts up front.
    host_key_policy: accept-new

# NUT source — connects to the nut-upsd container (or any NUT server).
# When using compose.yaml, the host is the service name "nut".
# When NUT runs on the same host natively, use "localhost".
sources:
  - name: ups
    type: nut
    config:
      instances:
        - name: rack_ups
          host: nut
          port: 3493
          ups: ups
          # Required by any NUT server that is not wide open, and always
          # required for the instant commands post_shutdown uses.
          username: canarium
          password: ${NUT_PASSWORD}
          poll_interval: 15s

clients:
  - name: steel
    description: "Compute node"
    transport: proxmox
    address: 10.0.10.11
    mac: "aa:bb:cc:dd:ee:01"
    credentials: ${PROXMOX_TOKEN}
    tags: [compute]
    # Which UPS feeds this machine. feed_policy: any (the default) means a
    # single-PSU host, threatened as soon as its one feed is.
    feeds: [rack_ups]
    feed_policy: any
    shutdown_budget: 3m
    probe:
      method: tcp
      port: 22
    config:
      # Proxmox ships a self-signed certificate. Pin it rather than skipping
      # verification: the API token below controls the whole hypervisor.
      # tls_ca_cert: /etc/canarium/proxmox-ca.pem
      tls_insecure_skip_verify: true
    wake:
      transport: wol
      broadcast: 10.0.10.255    # target subnet for WOL; set per VLAN

  - name: vanadium
    description: "Compute node 2"
    transport: ssh
    address: 10.0.10.12
    mac: "aa:bb:cc:dd:ee:02"
    tags: [compute]
    feeds: [rack_ups]
    shutdown_budget: 2m
    probe:
      method: tcp
      port: 22
    wake:
      transport: wol
      broadcast: 10.0.10.255

  - name: brick
    description: "TrueNAS storage"
    transport: truenas
    address: 10.0.10.20
    credentials: ${TRUENAS_API_KEY}
    tags: [storage]
    feeds: [rack_ups]
    shutdown_budget: 5m
    probe:
      method: tcp
      port: 443
    config:
      # tls_ca_cert: /etc/canarium/truenas-ca.pem
      tls_insecure_skip_verify: true
    wake:
      transport: wol
      mac: "aa:bb:cc:dd:ee:10"
      broadcast: 10.0.10.255
    depends_on: []

  - name: niobium
    description: "OPNsense firewall"
    transport: opnsense
    address: 10.0.1.1
    credentials: ${OPNSENSE_API_KEY}:${OPNSENSE_API_SECRET}
    tags: [infrastructure]
    feeds: [rack_ups]
    shutdown_budget: 2m
    probe:
      method: tcp
      port: 443
    config:
      # tls_ca_cert: /etc/canarium/opnsense-ca.pem
      tls_insecure_skip_verify: true

plans:
  - name: outage
    trigger:
      condition: state
      fact: rack_ups.status
      contains: OB
      for: 30s

    abort:
      condition: state
      fact: rack_ups.status
      contains: OL
      for: 60s

    shutdown:
      stages:
        - name: compute
          # If this condition has not held within wait_timeout, wait_policy
          # decides what happens. "skip" (the default) abandons the stage and
          # these clients are never shut down; "hold" waits indefinitely for
          # the condition or for an operator to force it through.
          wait_policy: hold
          wait_timeout: 30m
          when:
            condition: or
            conditions:
              - condition: numeric
                fact: rack_ups.battery.charge
                below: 50
              - condition: numeric
                fact: rack_ups.battery.runtime
                below: 600
          clients: [tag:compute]
          budget: 5m
          point_of_no_return: true

        - name: storage
          when:
            condition: numeric
            fact: rack_ups.battery.charge
            below: 35
          clients: [tag:storage]
          budget: 5m

        - name: infrastructure
          when:
            condition: numeric
            fact: rack_ups.battery.charge
            below: 25
          clients: [tag:infrastructure]
          budget: 3m

    wake:
      gate:
        condition: and
        conditions:
          - condition: state
            fact: rack_ups.status
            contains: OL
          - condition: numeric
            fact: rack_ups.battery.charge
            above: 60
            for: 5m
      stagger: 45s
      order: reverse
      probe_interval: 30s
      boot_deadline: 5m
      retries: 3
