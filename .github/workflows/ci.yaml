name: CI

on:
  # Every branch, not just main. Twelve commits of hardening work sat on a
  # branch that CI had never once looked at, because the only trigger was a
  # push to main -- so the first time the suite would have run against any
  # of it was after the merge, which is the one moment it is least useful.
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24.21"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./modules ./web.go)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Audit frontend dependencies
        run: cd web && npm audit --audit-level=high

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Validate example config
        run: |
          go build -o canarium ./cmd/canarium
          ./canarium validate -c examples/basic.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.8"
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # This is the linter's own version, not the action's.
          #
          # golangci-lint refuses to analyse a module whose targeted Go
          # version is newer than the one it was itself built with, so the
          # Go toolchain cannot move ahead of it. v2.13.2 is built against
          # Go 1.26, which is why go.mod, the Dockerfile and the go-version
          # above are all still on 1.26.8: bumping them to 1.27 produces
          #
          #   the Go language version (go1.26) used to build golangci-lint
          #   is lower than the targeted Go version (1.27.0)
          #
          # and the lint job fails. Dependabot will keep offering the Go
          # bump; it is only safe once a golangci-lint release built on the
          # newer toolchain exists. Move both together, or neither.
          version: v2.13.2

  build-image:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      # Signing the provenance attestation below.
      id-token: write
      attestations: write
    env:
      # Publishing belongs to main and to release tags. Now that CI runs on
      # every branch, an unconditional push would have tagged whatever
      # branch last built as :latest -- so a work-in-progress commit could
      # become the image every deployment pulls.
      PUBLISH: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        if: env.PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag names, derived from what is being built.
      #
      # The previous set was :latest plus :<sha> and nothing else, so a
      # release tag produced no version anyone could pin to -- the only way
      # to ask for 0.1.0 specifically would have been to know its commit
      # hash. A release nobody can name is not much of a release.
      #
      # :latest now follows releases rather than the tip of main, which is
      # what the compose file and the README have always implied it meant.
      # Main still publishes, as :main, for anyone who wants the edge.
      - name: Image metadata
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      # On a branch: build for one architecture and throw the result away.
      # That still proves the Dockerfile works against these sources, which
      # is what a branch needs to know, without spending twenty minutes
      # emulating arm64 and arm/v7 on every push.
      - name: Build image (branch check)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish image
        id: publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # The container is how Canarium is distributed, so the supply
          # chain evidence belongs on the image rather than on a pile of
          # loose binaries nobody downloads. An SBOM lists what is inside
          # it; the attestation below proves where it came from.
          sbom: true
          provenance: mode=max
          # meta.outputs.version is the release number on a tag build and
          # the branch name otherwise, so `canarium --version` reports
          # something a human recognises rather than a commit hash.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed proof that this exact image was built by this workflow, from
      # this commit. `gh attestation verify` checks it, so someone pulling
      # the image can establish it came from here rather than from whoever
      # last had a registry token.
      - name: Attest provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
