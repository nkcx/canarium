name: CI

on:
  # Every branch, not just main. Twelve commits of hardening work sat on a
  # branch that CI had never once looked at, because the only trigger was a
  # push to main -- so the first time the suite would have run against any
  # of it was after the merge, which is the one moment it is least useful.
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.21"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./modules ./web.go)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Audit frontend dependencies
        run: cd web && npm audit --audit-level=high

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      - name: Validate example config
        run: |
          go build -o canarium ./cmd/canarium
          ./canarium validate -c examples/basic.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          # v2 is required: earlier releases are built against Go 1.24 and
          # refuse to analyse a module targeting a newer language version.
          version: v2.13.2

  build-image:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      # Publishing belongs to main and to release tags. Now that CI runs on
      # every branch, an unconditional push would have tagged whatever
      # branch last built as :latest -- so a work-in-progress commit could
      # become the image every deployment pulls.
      PUBLISH: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a branch: build for one architecture and throw the result away.
      # That still proves the Dockerfile works against these sources, which
      # is what a branch needs to know, without spending twenty minutes
      # emulating arm64 and arm/v7 on every push.
      - name: Build image (branch check)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
