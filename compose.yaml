# Canarium + NUT deployment
#
# Prerequisites:
#   1. Find your UPS USB device: lsusb | grep -i ups
#   2. Copy .env.example to .env and fill in your values
#   3. Uncomment the `devices:` entry under the nut service for your UPS
#   4. docker compose up -d
#
# NUT configuration:
#   For most USB-connected UPS units, the env vars below are sufficient.
#   For advanced setups (custom drivers, multiple UPS, SNMP UPS), mount
#   config files into /etc/nut/local/ — see instantlinux/nut-upsd docs.
#
# Finding your UPS:
#   Most consumer UPS units (APC, CyberPower, Eaton) use the usbhid-ups
#   driver. Run `nut-scanner -U` inside the container to auto-detect,
#   or check: https://networkupstools.org/stable-hcl.html
#
# WOL and multi-VLAN networking:
#   WOL magic packets are UDP broadcasts. Each client's wake config
#   specifies a broadcast address targeting the correct subnet/VLAN.
#   Canarium infers the broadcast from the client IP when possible,
#   but for multi-VLAN setups you should set it explicitly:
#
#     wake:
#       transport: wol
#       broadcast: 10.0.10.255    # target the client's VLAN
#
#   For the container to reach multiple VLANs, attach it to the
#   appropriate Docker networks (macvlan, ipvlan, or bridged to
#   the correct interfaces). See the Traefik example below.

services:
  nut:
    image: instantlinux/nut-upsd:latest
    container_name: nut
    restart: unless-stopped
    environment:
      - API_USER=${NUT_USER:-canarium}
      - API_PASSWORD=${NUT_PASSWORD:?NUT_PASSWORD must be set in .env}
      - DRIVER=${NUT_DRIVER:-usbhid-ups}
      - NAME=${NUT_UPS_NAME:-ups}
      - PORT=auto
      - DESCRIPTION=${NUT_DESCRIPTION:-Rack UPS}
      - SERIAL=${NUT_SERIAL:-}
      - VENDORID=${NUT_VENDORID:-}
      - POLLINTERVAL=${NUT_POLL_INTERVAL:-15}
      - MAXAGE=${NUT_MAXAGE:-15}
    # NUT is reached by Canarium over the compose network; it does not need
    # to be published on the host. Uncomment only if you have other NUT
    # clients outside this stack, and prefer binding to a specific interface
    # (e.g. "127.0.0.1:3493:3493") over 0.0.0.0.
    # ports:
    #   - "3493:3493"
    #
    # USB passthrough — required for a locally connected UPS.
    # Find your device with: lsusb | grep -i ups
    # Example: Bus 001 Device 004 -> /dev/bus/usb/001/004
    #
    # Uncomment and set the path for your UPS:
    # devices:
    #   - /dev/bus/usb/001/004:/dev/bus/usb/001/004
    #
    # `privileged: true` also works and survives USB re-enumeration, but it
    # grants the container full access to every host device. Prefer the
    # explicit `devices:` mapping above unless re-enumeration is a real
    # problem for your hardware.

  canarium:
    image: ghcr.io/nkcx/canarium:latest
    container_name: canarium
    restart: unless-stopped
    depends_on:
      - nut
    # Credentials referenced from canarium.yaml as ${VAR} are expanded from
    # the process environment at config load time, so the file must be passed
    # through to the container. Without this, ${PROXMOX_TOKEN} and friends
    # stay unexpanded and every transport fails to authenticate.
    env_file:
      - .env
    ports:
      # The API has no TLS of its own. Publishing on 0.0.0.0 exposes the
      # admin interface to your whole network; bind to localhost and front it
      # with a reverse proxy, or restrict to a management interface.
      - "127.0.0.1:8420:8420"
    volumes:
      - ./canarium.yaml:/etc/canarium/config.yaml:ro
      - canarium-data:/var/lib/canarium
    # The image runs as uid/gid 65532. A named volume inherits that
    # ownership automatically; a bind mount must be chowned on the host.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Canarium targets a 128 MB footprint. Capping it makes a regression
    # visible as a restart rather than as host memory pressure.
    mem_limit: 256m
    # Uncomment for GPIO support on Raspberry Pi. The container user must be
    # in a group that can access the chardev (gpio group on Raspberry Pi OS).
    # devices:
    #   - /dev/gpiochip0:/dev/gpiochip0
    #
    # Multi-VLAN WOL: attach to Docker networks that can reach your
    # target subnets. Example with macvlan:
    #
    # networks:
    #   - default
    #   - vlan10
    #
    # Traefik: add labels and remove the ports section:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.canarium.rule=Host(`canarium.example.com`)"
    #   - "traefik.http.routers.canarium.tls=true"
    #   - "traefik.http.services.canarium.loadbalancer.server.port=8420"

volumes:
  canarium-data:

# Example macvlan network for WOL on VLAN 10:
# networks:
#   vlan10:
#     driver: macvlan
#     driver_opts:
#       parent: eth0.10
#     ipam:
#       config:
#         - subnet: 10.0.10.0/24
#           gateway: 10.0.10.1
